name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go tool mygo vet .
      - run: go tool mygo i18n check
      - name: Check the catalogs' accessors are generated
        run: go tool mygo generate && git diff --exit-code locales/catalog_gen.go
      - run: go test -race ./...
      - name: Build the app
        run: go tool mygo build -skip-dmg
